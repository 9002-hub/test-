services:
  db:
    image: postgres:17-alpine
    container_name: ledger-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgerpos
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    volumes:
      - ledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledgerpos"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: ledger-pos-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ledger:ledger@db:5432/ledgerpos?schema=public
      JWT_SECRET: ${JWT_SECRET:-ledger-pos-change-me}
      PORT: 4000
      NODE_ENV: production
    ports:
      - "4000:4000"
